services:
  traefik:
    image: traefik
    command:
      - --api=true
      - --api.insecure=true
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik/secrets:/secrets:ro
      - /opt/traefik_logs:/var/log/traefik
    networks:
      - web
      - traefik_proxy

  n8n:
    build: .
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=1200
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=1200
      - N8N_RUNNERS_TASK_TIMEOUT=1200
      - N8N_RUNNERS_MAX_CONCURRENCY=1
      - TRANSCRIPT_API_BASE=${TRANSCRIPT_API_BASE}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - AG1_DUCKDB_PATH=/files/duckdb/ag1_v3.duckdb
      - AG1_DUCKDB_WRITER_PATH=/files/AG1-V3-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_LEDGER_SCHEMA_PATH=/files/AG1-V3-EXPORT/sql/portfolio_ledger_schema_v2.sql
      - AG1_V4_DUCKDB_PATH=/files/duckdb/ag1_v4_consensus.duckdb
      - AG1_V4_DUCKDB_WRITER_PATH=/files/AG1-V4-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_V4_LEDGER_SCHEMA_PATH=/files/AG1-V4-EXPORT/sql/portfolio_ledger_schema_v4.sql
      - AG1_FX_V1_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_chatgpt52.duckdb
      - AG1_FX_V1_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_grok41_reasoning.duckdb
      - AG1_FX_V1_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_gemini30_pro.duckdb
      - AG2_FX_V1_DUCKDB_PATH=/files/duckdb/ag2_fx_v1.duckdb
      - AG3_FX_V1_DUCKDB_PATH=/files/duckdb/ag3_fx_v1.duckdb
      - AG4_FX_V1_DUCKDB_PATH=/files/duckdb/ag4_fx_v1.duckdb
      - AG1_FX_V1_WRITER_PATH=/files/AG1-FX-V1-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_FX_V1_LEDGER_SCHEMA_PATH=/files/AG1-FX-V1-EXPORT/sql/ag1_fx_v1_schema.sql
      - IBKR_BROKER_URL=http://ibkr-broker:8080
      - IBKR_DRY_RUN=${IBKR_DRY_RUN:-true}
      - IBKR_SEND_DRY_RUN_TO_BROKER=${IBKR_SEND_DRY_RUN_TO_BROKER:-false}
      - AG1_ACTIONS_LIVE_ORDERS_ENABLED=${AG1_ACTIONS_LIVE_ORDERS_ENABLED:-false}
      - AG1_ACTIONS_IBKR_ENABLED_MODELS=${AG1_ACTIONS_IBKR_ENABLED_MODELS:-gemini}
      - AG1_V4_ACTIONS_IBKR_ENABLED_MODELS=${AG1_V4_ACTIONS_IBKR_ENABLED_MODELS:-ag1_v4_consensus}
      - IBKR_REQUIRE_PAPER_ACCOUNT=${IBKR_REQUIRE_PAPER_ACCOUNT:-true}
      - IBKR_PAPER_ACCOUNT_PREFIXES=${IBKR_PAPER_ACCOUNT_PREFIXES:-DU}
      - IBKR_RECONCILE_CASH_BALANCES=${IBKR_RECONCILE_CASH_BALANCES:-true}
      - IBKR_BLOCK_ON_CASH_DIVERGENCE=${IBKR_BLOCK_ON_CASH_DIVERGENCE:-false}
      - IBKR_CASH_RECON_THRESHOLD_UNITS=${IBKR_CASH_RECON_THRESHOLD_UNITS:-5}
      - IBKR_FILL_CONFIRM_SECONDS=${IBKR_FILL_CONFIRM_SECONDS:-6}
      - IBKR_FILL_POLL_INTERVAL_SECONDS=${IBKR_FILL_POLL_INTERVAL_SECONDS:-2}
      - IBKR_SEND_NODE_TIME_BUDGET_SECONDS=${IBKR_SEND_NODE_TIME_BUDGET_SECONDS:-50}
      - AG1_FX_PORTFOLIO_BASE_CCY=${AG1_FX_PORTFOLIO_BASE_CCY:-EUR}
      - AG1_FX_CASH_ONLY_BASE_CCY_MODE=${AG1_FX_CASH_ONLY_BASE_CCY_MODE:-true}
      - AG1_FX_PREFUND_NON_EUR_FX=${AG1_FX_PREFUND_NON_EUR_FX:-true}
      - AG1_FX_PREFUND_BUFFER_PCT=${AG1_FX_PREFUND_BUFFER_PCT:-0.005}
      - AG1_FX_REDUCED_SIZE_MAX_PAIR_PCT=${AG1_FX_REDUCED_SIZE_MAX_PAIR_PCT:-0.15}
      - AG1_FX_ESTIMATED_FEE_PER_FILL_EUR=${AG1_FX_ESTIMATED_FEE_PER_FILL_EUR:-1.75}
      - AG1_FX_MIN_NEW_TRADE_NOTIONAL_EUR=${AG1_FX_MIN_NEW_TRADE_NOTIONAL_EUR:-1200}
      - AG1_FX_TARGET_NEW_TRADE_NOTIONAL_EUR=${AG1_FX_TARGET_NEW_TRADE_NOTIONAL_EUR:-1700}
      - AG1_FX_MIN_EXPECTED_GROSS_PROFIT_EUR=${AG1_FX_MIN_EXPECTED_GROSS_PROFIT_EUR:-8}
      - AG1_FX_MIN_REWARD_TO_FEE=${AG1_FX_MIN_REWARD_TO_FEE:-2.0}
      - AG1_FX_MIN_CLOSE_NET_PROFIT_EUR=${AG1_FX_MIN_CLOSE_NET_PROFIT_EUR:-2.0}
      - AG1_FX_MIN_DISCRETIONARY_HOLD_HOURS=${AG1_FX_MIN_DISCRETIONARY_HOLD_HOURS:-24}
      - AG1_FX_LLM_TOP_NEWS_MAX=${AG1_FX_LLM_TOP_NEWS_MAX:-4}
      - AG1_FX_LLM_MARKET_WATCH_MAX=${AG1_FX_LLM_MARKET_WATCH_MAX:-10}
      - AG1_FX_LLM_PAIR_DRIVERS_MAX=${AG1_FX_LLM_PAIR_DRIVERS_MAX:-1}
      # Macro Data API (3 piliers)
      - MACRO_DATA_API_URL=http://macro-data-api:8081
      - MACRO_DUCKDB_PATH=/files/duckdb/macro_data.duckdb
      # AG1-FX-V2 (portfolio manager 3 piliers)
      - AG1_FX_V2_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_chatgpt52.duckdb
      - AG1_FX_V2_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_grok41_reasoning.duckdb
      - AG1_FX_V2_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_gemini30_pro.duckdb
      - AG1_FX_V2_LEDGER_SCHEMA_PATH=/files/AG1-FX-V2-EXPORT/sql/ag1_fx_v2_schema.sql
      - AG1_FX_V2_LEVERAGE_MAX=${AG1_FX_V2_LEVERAGE_MAX:-2.0}
      - EXECUTIONS_DATA_MAX_AGE=72
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      - DB_SQLITE_VACUUM_ON_STARTUP=true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
      - /opt/trader-ia/AG1-V2-EXPORT:/files/AG1-V2-EXPORT:ro
    networks:
      - web

  task-runners:
    build:
      context: .
      dockerfile: Dockerfile.runners
    deploy:
      replicas: 3
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_MAX_CONCURRENCY=4
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
      - TRANSCRIPT_API_BASE=${TRANSCRIPT_API_BASE}
      - AG1_DUCKDB_PATH=/files/duckdb/ag1_v3.duckdb
      - AG1_DUCKDB_WRITER_PATH=/files/AG1-V3-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_LEDGER_SCHEMA_PATH=/files/AG1-V3-EXPORT/sql/portfolio_ledger_schema_v2.sql
      - AG1_V4_DUCKDB_PATH=/files/duckdb/ag1_v4_consensus.duckdb
      - AG1_V4_DUCKDB_WRITER_PATH=/files/AG1-V4-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_V4_LEDGER_SCHEMA_PATH=/files/AG1-V4-EXPORT/sql/portfolio_ledger_schema_v4.sql
      - AG1_FX_V1_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_chatgpt52.duckdb
      - AG1_FX_V1_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_grok41_reasoning.duckdb
      - AG1_FX_V1_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_gemini30_pro.duckdb
      - AG2_FX_V1_DUCKDB_PATH=/files/duckdb/ag2_fx_v1.duckdb
      - AG3_FX_V1_DUCKDB_PATH=/files/duckdb/ag3_fx_v1.duckdb
      - AG4_FX_V1_DUCKDB_PATH=/files/duckdb/ag4_fx_v1.duckdb
      - AG1_FX_V1_WRITER_PATH=/files/AG1-FX-V1-EXPORT/nodes/post_agent/duckdb_writer.py
      - AG1_FX_V1_LEDGER_SCHEMA_PATH=/files/AG1-FX-V1-EXPORT/sql/ag1_fx_v1_schema.sql
      - IBKR_BROKER_URL=http://ibkr-broker:8080
      - IBKR_DRY_RUN=${IBKR_DRY_RUN:-true}
      - IBKR_SEND_DRY_RUN_TO_BROKER=${IBKR_SEND_DRY_RUN_TO_BROKER:-false}
      - AG1_ACTIONS_LIVE_ORDERS_ENABLED=${AG1_ACTIONS_LIVE_ORDERS_ENABLED:-false}
      - AG1_ACTIONS_IBKR_ENABLED_MODELS=${AG1_ACTIONS_IBKR_ENABLED_MODELS:-gemini}
      - AG1_V4_ACTIONS_IBKR_ENABLED_MODELS=${AG1_V4_ACTIONS_IBKR_ENABLED_MODELS:-ag1_v4_consensus}
      - IBKR_REQUIRE_PAPER_ACCOUNT=${IBKR_REQUIRE_PAPER_ACCOUNT:-true}
      - IBKR_PAPER_ACCOUNT_PREFIXES=${IBKR_PAPER_ACCOUNT_PREFIXES:-DU}
      - IBKR_RECONCILE_CASH_BALANCES=${IBKR_RECONCILE_CASH_BALANCES:-true}
      - IBKR_BLOCK_ON_CASH_DIVERGENCE=${IBKR_BLOCK_ON_CASH_DIVERGENCE:-false}
      - IBKR_CASH_RECON_THRESHOLD_UNITS=${IBKR_CASH_RECON_THRESHOLD_UNITS:-5}
      - IBKR_FILL_CONFIRM_SECONDS=${IBKR_FILL_CONFIRM_SECONDS:-6}
      - IBKR_FILL_POLL_INTERVAL_SECONDS=${IBKR_FILL_POLL_INTERVAL_SECONDS:-2}
      - IBKR_SEND_NODE_TIME_BUDGET_SECONDS=${IBKR_SEND_NODE_TIME_BUDGET_SECONDS:-50}
      - AG1_FX_PORTFOLIO_BASE_CCY=${AG1_FX_PORTFOLIO_BASE_CCY:-EUR}
      - AG1_FX_CASH_ONLY_BASE_CCY_MODE=${AG1_FX_CASH_ONLY_BASE_CCY_MODE:-true}
      - AG1_FX_PREFUND_NON_EUR_FX=${AG1_FX_PREFUND_NON_EUR_FX:-true}
      - AG1_FX_PREFUND_BUFFER_PCT=${AG1_FX_PREFUND_BUFFER_PCT:-0.005}
      - AG1_FX_REDUCED_SIZE_MAX_PAIR_PCT=${AG1_FX_REDUCED_SIZE_MAX_PAIR_PCT:-0.15}
      - AG1_FX_ESTIMATED_FEE_PER_FILL_EUR=${AG1_FX_ESTIMATED_FEE_PER_FILL_EUR:-1.75}
      - AG1_FX_MIN_NEW_TRADE_NOTIONAL_EUR=${AG1_FX_MIN_NEW_TRADE_NOTIONAL_EUR:-1200}
      - AG1_FX_TARGET_NEW_TRADE_NOTIONAL_EUR=${AG1_FX_TARGET_NEW_TRADE_NOTIONAL_EUR:-1700}
      - AG1_FX_MIN_EXPECTED_GROSS_PROFIT_EUR=${AG1_FX_MIN_EXPECTED_GROSS_PROFIT_EUR:-8}
      - AG1_FX_MIN_REWARD_TO_FEE=${AG1_FX_MIN_REWARD_TO_FEE:-2.0}
      - AG1_FX_MIN_CLOSE_NET_PROFIT_EUR=${AG1_FX_MIN_CLOSE_NET_PROFIT_EUR:-2.0}
      - AG1_FX_MIN_DISCRETIONARY_HOLD_HOURS=${AG1_FX_MIN_DISCRETIONARY_HOLD_HOURS:-24}
      - AG1_FX_LLM_TOP_NEWS_MAX=${AG1_FX_LLM_TOP_NEWS_MAX:-4}
      - AG1_FX_LLM_MARKET_WATCH_MAX=${AG1_FX_LLM_MARKET_WATCH_MAX:-10}
      - AG1_FX_LLM_PAIR_DRIVERS_MAX=${AG1_FX_LLM_PAIR_DRIVERS_MAX:-1}
      - MACRO_DATA_API_URL=http://macro-data-api:8081
      - MACRO_DUCKDB_PATH=/files/duckdb/macro_data.duckdb
      - AG1_FX_V2_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_chatgpt52.duckdb
      - AG1_FX_V2_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_grok41_reasoning.duckdb
      - AG1_FX_V2_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_gemini30_pro.duckdb
      - AG1_FX_V2_LEDGER_SCHEMA_PATH=/files/AG1-FX-V2-EXPORT/sql/ag1_fx_v2_schema.sql
      - AG1_FX_V2_LEVERAGE_MAX=${AG1_FX_V2_LEVERAGE_MAX:-2.0}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    volumes:
      - /opt/trader-ia/n8n-task-runners.clean.json:/etc/n8n-task-runners.json:ro
      - /opt/trader-ia/duckdb_home:/home/runner/.duckdb:rw
      - /local-files:/files:rw
      - /opt/yf-enrichment-v1:/opt/yf-enrichment-v1:ro
      - n8n_data:/home/node/.n8n:rw
    depends_on:
      - n8n
    networks:
      - web

  trading-dashboard:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - TZ=${GENERIC_TIMEZONE:-Europe/Paris}
      - DUCKDB_DIR=/files/duckdb
      - AG2_DUCKDB_PATH=/files/duckdb/ag2_v3.duckdb
      - AG1_DUCKDB_PATH=/files/duckdb/ag1_v3.duckdb
      - AG1_V4_DUCKDB_PATH=/files/duckdb/ag1_v4_consensus.duckdb
      - AG1_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_v3_chatgpt52.duckdb
      - AG1_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_v3_grok41_reasoning.duckdb
      - AG1_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_v3_gemini30_pro.duckdb
      - AG3_DUCKDB_PATH=/files/duckdb/ag3_v2.duckdb
      - AG4_DUCKDB_PATH=/files/duckdb/ag4_v3.duckdb
      - AG4_SPE_DUCKDB_PATH=/files/duckdb/ag4_spe_v2.duckdb
      - AG4_FOREX_DUCKDB_PATH=/files/duckdb/ag4_forex_v1.duckdb
      - AG1_FX_V1_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_chatgpt52.duckdb
      - AG1_FX_V1_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_grok41_reasoning.duckdb
      - AG1_FX_V1_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v1_gemini30_pro.duckdb
      - AG2_FX_V1_DUCKDB_PATH=/files/duckdb/ag2_fx_v1.duckdb
      - AG3_FX_V1_DUCKDB_PATH=/files/duckdb/ag3_fx_v1.duckdb
      - AG4_FX_V1_DUCKDB_PATH=/files/duckdb/ag4_fx_v1.duckdb
      - YF_ENRICH_DUCKDB_PATH=/files/duckdb/yf_enrichment_v1.duckdb
      - MACRO_DUCKDB_PATH=/files/duckdb/macro_data.duckdb
      - AG1_FX_V2_CHATGPT52_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_chatgpt52.duckdb
      - AG1_FX_V2_GROK41_REASONING_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_grok41_reasoning.duckdb
      - AG1_FX_V2_GEMINI30_PRO_DUCKDB_PATH=/files/duckdb/ag1_fx_v2_gemini30_pro.duckdb
    command: sh -lc "pip install --no-cache-dir -r requirements.txt && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.tradingdash.rule=Host(`${DASHBOARD_DOMAIN}`)
      - traefik.http.routers.tradingdash.entrypoints=websecure
      - traefik.http.routers.tradingdash.tls=true
      - traefik.http.routers.tradingdash.tls.certresolver=mytlschallenge
      - traefik.http.services.tradingdash.loadbalancer.server.port=8501
      - traefik.http.routers.tradingdash.middlewares=tradingdash-auth
      - traefik.http.middlewares.tradingdash-auth.basicauth.users=${DASHBOARD_BASIC_AUTH}
    restart: unless-stopped
    volumes:
      - /opt/trading-dashboard/app:/app:ro
      - /local-files/duckdb:/files/duckdb:ro
    networks:
      - web

  toolbox:
    image: alpine:3.20
    command: sh -lc "apk add --no-cache curl jq && sleep infinity"
    restart: unless-stopped
    networks:
      - web

  # ── Macro Data API (Framework 3 Piliers) ─────────────────────────────────
  # Service de données macro : FRED API, COT CFTC, courbe des taux.
  # Requis par AG5-FX-Macro, AG6-FX-Valuation, AG7-FX-Positioning, AG8-FX-Rates, AG1-FX-V2.
  # PRÉREQUIS : ajouter FRED_API_KEY dans .env (gratuit sur fred.stlouisfed.org)
  macro-data-api:
    build:
      context: ../../services/macro-data-api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - MACRO_DUCKDB_PATH=/files/duckdb/macro_data.duckdb
      - IBKR_BROKER_URL=http://ibkr-broker:8080
    volumes:
      - /local-files:/files:rw
    networks:
      - web
    depends_on:
      - ibkr-broker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=5).read()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 15s

  # ── IBKR Client Portal API Gateway ────────────────────────────────────────
  # Lance le clientportal.gw d'IBKR. Expose le port 5000 en interne seulement.
  # AUTHENTIFICATION INITIALE (manuelle, une seule fois) :
  #   ssh -L 5000:localhost:5000 user@vps   → https://localhost:5000 dans navigateur
  ibkr-gateway:
    image: voyz/ibeam:latest
    restart: "no"
    command: ["sh", "-lc", "cd /srv/clientportal.gw && bash bin/run.sh root/conf.yaml"]
    # Port 5000 accessible uniquement depuis le réseau Docker interne (pas exposé publiquement)
    expose:
      - "5000"
      - "5001"
    environment:
      - IBEAM_ACCOUNT=${IBEAM_ACCOUNT:-}
      - IBEAM_PASSWORD=${IBEAM_PASSWORD:-}
      - IBEAM_LOG_LEVEL=${IBEAM_LOG_LEVEL:-INFO}
      - IBEAM_LOG_TO_FILE=${IBEAM_LOG_TO_FILE:-True}
      - IBEAM_ERROR_SCREENSHOTS=${IBEAM_ERROR_SCREENSHOTS:-True}
      - IBEAM_GATEWAY_BASE_URL=${IBEAM_GATEWAY_BASE_URL:-https://localhost:5000}
      - IBEAM_MAINTENANCE_INTERVAL=${IBEAM_MAINTENANCE_INTERVAL:-60}
      - IBEAM_MAX_FAILED_AUTH=${IBEAM_MAX_FAILED_AUTH:-3}
      - IBEAM_RESTART_FAILED_SESSIONS=${IBEAM_RESTART_FAILED_SESSIONS:-True}
    volumes:
      - ../../services/ibkr-gateway/conf.yaml:/srv/inputs/conf.yaml:ro
      - ../../services/ibkr-gateway/conf.yaml:/srv/clientportal.gw/root/conf.yaml:ro
      - ibeam_outputs:/srv/outputs
    networks:
      - web
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c 'import ssl, urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen(\"https://localhost:5000\", context=ctx, timeout=5).read()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── IBKR Broker microservice (FastAPI) ────────────────────────────────────
  # Wrapper REST autour du CPAPI. Appelé par les nodes n8n pour envoyer les ordres.
  # IBKR_DRY_RUN=true → log uniquement, aucun ordre réel envoyé (mode par défaut).
  ibkr-broker:
    build:
      context: ../../services/ibkr-broker
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - IBKR_GATEWAY_URL=https://ibkr-gateway:5000
      - IBKR_DRY_RUN=${IBKR_DRY_RUN:-true}
      - IBKR_SSL_VERIFY=false
      - IBKR_ACCOUNT_ID=${IBKR_ACCOUNT_ID:-}
      - IBKR_KEEPALIVE_INTERVAL_SECONDS=${IBKR_KEEPALIVE_INTERVAL_SECONDS:-55}
      - IBKR_AUTO_REAUTH_ENABLED=${IBKR_AUTO_REAUTH_ENABLED:-true}
      - IBKR_AUTO_REAUTH_COMPETE=${IBKR_AUTO_REAUTH_COMPETE:-false}
      - IBKR_AUTO_CONFIRM_PRICE_WARNINGS=${IBKR_AUTO_CONFIRM_PRICE_WARNINGS:-false}
      - IBKR_PRICE_GUARD_URL=${IBKR_PRICE_GUARD_URL:-http://yfinance-api:8080/quote}
      - IBKR_PRICE_GUARD_MAX_DEVIATION_PCT=${IBKR_PRICE_GUARD_MAX_DEVIATION_PCT:-3.0}
      - IBKR_PRICE_GUARD_MAX_QUOTE_AGE_SECONDS=${IBKR_PRICE_GUARD_MAX_QUOTE_AGE_SECONDS:-28800}
      - IBKR_AUTO_CONFIRM_MAX_STEPS=${IBKR_AUTO_CONFIRM_MAX_STEPS:-4}
      - IBKR_ALERT_WEBHOOK_URL=${IBKR_ALERT_WEBHOOK_URL:-}
      - IBKR_ALERT_COOLDOWN_SECONDS=${IBKR_ALERT_COOLDOWN_SECONDS:-900}
      - IBKR_LOGIN_URL=${IBKR_LOGIN_URL:-https://localhost:5000}
      - IBKR_LOGIN_TUNNEL_COMMAND=${IBKR_LOGIN_TUNNEL_COMMAND:-ssh -L 5000:127.0.0.1:5000 root@100.104.236.78}
      - IBKR_ASSISTED_LOGIN_ENABLED=${IBKR_ASSISTED_LOGIN_ENABLED:-false}
      - IBKR_USERNAME=${IBKR_USERNAME:-}
      - IBKR_PASSWORD=${IBKR_PASSWORD:-}
      - IBEAM_ACCOUNT=${IBEAM_ACCOUNT:-}
      - IBEAM_PASSWORD=${IBEAM_PASSWORD:-}
    networks:
      - web
    depends_on:
      - ibkr-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  traefik_proxy:
    external: true
  web:
    external: true

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
  ibeam_outputs:
