services:
  yfinance-api:
    build:
      context: /docker/root/yfinance-api
      dockerfile: Dockerfile
    container_name: yfinance-api
    environment:
      - TZ=${GENERIC_TIMEZONE:-Europe/Paris}
      - YF_DATA_DIR=/data
      - YF_INIT_LOOKBACK_DAYS=400
      - YF_OVERLAP_BARS=3
      - YF_COOLDOWN_BASE_SEC=300
      - YF_COOLDOWN_MAX_SEC=3600
      - YF_COOLDOWN_RATELIMIT_SEC=1800
      - YF_MIN_SECONDS_BETWEEN_CALLS=5
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    volumes:
      - yfinance_data:/data
    networks:
      web:
        aliases:
          - yfinance-api

  yf-enrichment:
    build:
      context: /opt/yf-enrichment-service
      dockerfile: Dockerfile
    container_name: yf-enrichment
    environment:
      - TZ=${GENERIC_TIMEZONE:-Europe/Paris}
      - YF_ENRICH_SCRIPT=/opt/yf-enrichment-v1/daily_enrichment.py
    restart: unless-stopped
    volumes:
      - /opt/yf-enrichment-v1:/opt/yf-enrichment-v1:ro
      - /local-files:/files:rw
    depends_on:
      - yfinance-api
    networks:
      - web

  ibkr-gateway:
    build:
      context: /opt/trader-ia/services/ibkr-gateway
      dockerfile: Dockerfile
    container_name: ibkr-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      web:
        aliases:
          - ibkr-gateway
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -kfsS https://localhost:5000/demo >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  ibkr-broker:
    build:
      context: /opt/trader-ia/services/ibkr-broker
      dockerfile: Dockerfile
    container_name: ibkr-broker
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      - IBKR_GATEWAY_URL=https://ibkr-gateway:5000
      - IBKR_DRY_RUN=${IBKR_DRY_RUN:-true}
      - IBKR_SSL_VERIFY=false
      - IBKR_ACCOUNT_ID=${IBKR_ACCOUNT_ID:-}
    depends_on:
      - ibkr-gateway
    networks:
      web:
        aliases:
          - ibkr-broker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true

volumes:
  yfinance_data:
    external: true
    name: yfinance_data
