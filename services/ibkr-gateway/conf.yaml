# IBKR Client Portal Gateway — configuration
# Référence : https://interactivebrokers.github.io/cpwebapi/

listenPort: 5000

# SSL auto-signé par défaut (le ibkr-broker service désactive la vérification)
# Pour un vrai certificat : pointer vers les fichiers cert/key
# sslCert: /root/certs/cert.pem
# sslKey: /root/certs/key.pem

# Autoriser les connexions depuis le réseau Docker interne (pas seulement localhost)
listenSsl: true

# Timeout de session (en secondes, max 24h)
sessionTimeout: 86400

# Logging
logging:
  level: INFO
